name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # variaveis de ambiente para todos os steps deste job: o Django precisa
    # do SECRET_KEY para bootar (makemigrations e pytest). valor dummy — o CI
    # e efemero e nao assina nada real, entao nao precisa ser secreto
    env:
      SECRET_KEY: "ci-dummy-key-not-secret-just-for-tests"
      DEBUG: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: pytest -v